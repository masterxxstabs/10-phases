name: Build Windows exe

# Builds dist/10Phases.exe: a single file that runs without Python installed.
# - Every push to master: the exe is attached to the workflow run as an artifact.
# - When master has a version (ten_phases/__init__.py) with no release yet, the workflow
#   tags that commit and publishes a GitHub Release with the exe. Bump the version to release.
on:
  push:
    branches: [master]
    tags: ["v*"]
    paths-ignore: ["README.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Build exe
        run: python tools/build.py

      - name: Check the exe starts
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\10Phases.exe -ArgumentList "--smoke-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "10Phases.exe --smoke-test exited with $($p.ExitCode)" }
          "Smoke test passed; size: {0:N1} MB" -f ((Get-Item dist\10Phases.exe).Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: 10Phases-windows
          path: dist/10Phases.exe

      - name: Read version
        id: version
        shell: bash
        run: |
          ver=$(python -c "import ten_phases; print(ten_phases.__version__)")
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"
          if gh release view "v$ver" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # A new version number on master (or a pushed v* tag) publishes a Release with the exe.
      - name: Publish release
        if: steps.version.outputs.exists == 'false' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: 10 Phases ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/10Phases.exe
          body: |
            **Download `10Phases.exe` below and double-click it.** No install or Python needed.

            Windows may show "Windows protected your PC" because the exe isn't code-signed:
            click **More info** then **Run anyway**. The first time you host a multiplayer game,
            allow it through the firewall on private networks so friends can connect.
