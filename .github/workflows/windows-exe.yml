name: Build Windows exe

# Builds dist/10Phases.exe: a single file that runs without Python installed.
# - Every push to master: the exe is attached to the workflow run as an artifact.
# - When master has a version (ten_phases/__init__.py) with no release yet, the workflow
#   tags that commit and publishes a GitHub Release with the exe. Bump the version to release.
on:
  push:
    branches: [ci-hang-probe]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow pytest

      - name: Probe the v1.11.0 test hang
        timeout-minutes: 50
        shell: pwsh
        run: |
          for ($i = 1; $i -le 8; $i++) {
            Write-Host "=== run $i ==="
            python -X faulthandler -m pytest -q -p no:cacheprovider --durations=8 -o faulthandler_timeout=90 tests
          }
